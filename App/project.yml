name: NASSync
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: App.xcconfig
  Release: App.xcconfig
packages:
  SyncCore:
    path: ..
targets:
  NAS Sync:
    type: application
    platform: macOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: SyncCore
        product: SyncCore
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: NAS Sync
        CFBundleDisplayName: NAS Sync
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: MIT License
        NSLocationUsageDescription: NAS Sync reads the Wi-Fi network name to know when you're home. Your location is never stored or sent anywhere.
        NSLocationWhenInUseUsageDescription: NAS Sync reads the Wi-Fi network name to know when you're home. Your location is never stored or sent anywhere.
        NSLocalNetworkUsageDescription: NAS Sync connects to your NAS on the local network.
    entitlements:
      path: Resources/NASSync.entitlements
      properties:
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_NAME: NAS Sync
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
